server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rent-job-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/rent_job?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: care2002
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 上传与 JWT 配置（生产环境务必修改 secret，并妥善保管）
upload:
  # 图片保存目录，可改成绝对路径如 /data/rent/upload
  path: ./uploads/
  # 允许的图片后缀
  allow-ext: jpg,jpeg,png,gif,webp,bmp
  max-size: 10485760

jwt:
  # 生产环境请替换为随机字符串，不要使用默认值
  secret: rentjob-default-secret-please-change-me
  # token 有效期（小时）
  expire-hours: 12

app:
  admin:
    # 首次启动自动创建的超级管理员账号（仅当 sys_user 表为空时创建）
    default-username: admin
    default-password: admin123

logging:
  level:
    root: info
    com.aixueyuan.rent: debug
